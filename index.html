<style>

eight:95px;resize:vertical}.roster,.history{max-height:200px;overflow:auto;margin-top:10px}.person,.record{display:flex;align-items:center;gap:7px;padding:7px 3px;border-bottom:1px solid #ffffff1b}.person .name,.record .name{flex:1;overflow-wrap:anywhere}.person.picked{opacity:.53}.person input{min-width:0;flex:1}.tiny{font-size:12px;padding:6px 9px}.pill{font-size:11px;background:#c4f0ff;color:#172b4a;border-radius:20px;padding:3px 7px}.field{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0}.field select{min-width:0;max-width:190px}.help{font-size:12px;color:#d4dced;line-height:1.5}.wheel{width:min(310px,65vw);aspect-ratio:1;position:relative;border-radius:50%;border:10px solid #ffe5a7;box-shadow:0 0 35px #d4dbff99;transition:transform 5s cubic-bezier(.12,.7,.13,1);flex-shrink:0}.wheel:after{content:'✦';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#fff2bd;color:#773d94;font-size:27px;box-shadow:0 0 0 5px #7952ba}.pointer{font-size:34px;color:#ffeaa3;z-index:3;margin-bottom:-13px;text-shadow:0 0 15px #fff}.wheel-label{position:absolute;top:50%;left:50%;font-weight:900;font-size:12px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transform-origin:0 0;color:#fff;text-shadow:1px 1px #333}.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:720px}.pickcard{height:112px;width:90px;display:grid;place-items:center;position:relative;background:linear-gradient(130deg,#7451d7,#f47cad);border:3px solid #ffffff70;border-radius:15px;font-size:38px;box-shadow:0 8px 15px #0004;transition:transform .65s}.pickcard:not(:disabled):hover{transform:translateY(-9px)}.pickcard.revealed{background:linear-gradient(130deg,#ffda83,#fff0c7);color:#5b3383;transform:rotateY(360deg);font-size:20px;font-weight:900;overflow-wrap:anywhere}.slot{max-width:90%;width:450px;height:125px;border:5px solid #ffd57f;border-radius:15px;background:#1d2257;overflow:hidden;display:grid;place-items:center;box-shadow:0 0 25px #ffda85aa;z-index:2}.slot .display{font-size:clamp(34px,6vw,68px)}canvas{position:fixed;inset:0;pointer-events:none;z-index:10}@keyframes winnerPop{0%{transform:scale(.5);opacity:0}55%{transform:scale(1.19)}100%{transform:scale(1);opacity:1}}@media(max-width:930px){.layout{grid-template-columns:1fr}.stage{min-height:500px}.panel{margin-bottom:10px}}@media(max-width:500px){header,.layout{padding-left:12px;padding-right:12px}.stage{padding:12px}.arena{min-height:300px}.controls button{padding:11px}.controls .primary{padding:13px 25px}.settings{font-size:13px}.wheel{width:min(280px,75vw)}}body.full .layout{max-width:none;grid-template-columns:1fr}body.full aside{display:none}body.full .stage{min-height:calc(100vh - 115px)}body.full .arena{min-height:65vh}

<body data-theme="space"><canvas id="confetti"></canvas>
<header><div><h1>🎯 두근두근! 우리 반 랜덤 뽑기 🎉</h1><p>누가 뽑힐까? 두근두근, 운명의 순간!</p></div><div class="actions"><select id="theme" aria-label="배경 테마"><option value="space">🌌 우주</option><option value="festival">🎡 축제</option><option value="pastel">🌸 파스텔</option><option value="dark">🌑 다크</option></select><button id="soundBtn">🔊 소리 켜짐</button><label class="sub">음량 <input id="volume" type="range" min="0" max="100" value="40" style="width:75px;vertical-align:middle"></label><button id="fullBtn">⛶ 전체화면</button></div></header>
<div class="layout"><main class="stage"><div class="modebar" id="modebar"><button class="active" data-mode="name">✨ 이름 뽑기</button><button data-mode="wheel">🎡 룰렛</button><button data-mode="cards">🃏 카드 뒤집기</button><button data-mode="slot">🎰 슬롯머신</button></div><div class="settings"><label>⏱ 시간 <select id="duration"><option value="3000">3초</option><option selected value="5000">5초</option><option value="10000">10초</option></select></label><label>👥 뽑을 인원 <input id="count" type="number" min="1" max="999" value="1" style="width:75px"></label><label><input type="checkbox" id="repeat"> 중복 뽑기 허용</label></div>
<div class="arena" id="arena"><div class="eyebrow" id="eyebrow">READY TO PICK?</div><div class="display" id="display">두근두근 💖</div><div class="secondary" id="message">명단을 등록하고 시작 버튼을 눌러 주세요!</div><div id="visual" style="display:none"></div></div><div class="controls"><button class="primary" id="startBtn">🎉 뽑기 시작!</button><button id="againBtn">🔄 다시 뽑기</button><button id="resetPicked">♻️ 뽑힌 학생 초기화</button></div><div class="stats"><div class="stat"><strong id="totalStat">0</strong><span>전체 학생</span></div><div class="stat"><strong id="leftStat">0</strong><span>남은 학생</span></div><div class="stat"><strong id="pickedStat">0</strong><span>이번 회차 전까지 뽑힌 학생</span></div></div></main>
<aside><section class="panel"><h2>🏫 학급 관리</h2><div class="stack"><select id="classSelect" style="flex:1" aria-label="학급 선택"></select><button id="addClass" class="tiny">＋ 학급</button><button id="renameClass" class="tiny">✏️</button><button id="deleteClass" class="tiny danger">삭제</button></div><p class="help">학급별 명단과 기록은 이 브라우저에 자동 저장됩니다.</p></section><section class="panel"><h2>🧑‍🎓 학생 명단</h2><div class="stack"><input id="oneName" placeholder="이름 또는 출석번호"><button id="addOne">추가</button></div><p class="sub">여러 명 등록 · 쉼표 또는 줄바꿈으로 구분</p><textarea id="bulk" placeholder="김하늘, 이바다&#10;박별빛&#10;10401"></textarea><div class="stack"><button id="addBulk" class="primary">명단 일괄 추가</button><button id="clearRoster" class="danger">명단 삭제</button></div><div class="roster" id="roster"></div><div class="stack" style="margin-top:12px"><button id="importBtn" class="tiny">📥 가져오기</button><button id="exportBtn" class="tiny">📤 내보내기</button><button id="exportAllBtn" class="tiny">💾 전체 백업</button><input type="file" id="fileInput" accept=".txt,.csv,.json" hidden></div><p class="help">TXT·CSV 명단 / JSON 백업 파일 지원. 기록은 이 기기의 브라우저에만 보관됩니다.</p></section><section class="panel"><h2>🏆 당첨 기록</h2><div id="history" class="history"></div><button id="clearHistory" class="tiny danger" style="margin-top:10px">기록 삭제</button></section><section class="panel"><button class="danger wide" id="resetAll">⚠️ 전체 데이터 초기화</button></section></aside></div>
<script>
(()=>{'use strict';const KEY='heart-pick-classroom-v1';const $=id=>document.getElementById(id);let data,mode='name',busy=false,ctx=null,spin=0,particles=[],frame=null,cardCandidates=[];const defaults=()=>({classes:[{id:'class-default',name:'우리 반',names:[],picked:[],history:[]}],active:'class-default',theme:'space',sound:true,volume:40});function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return v&&Array.isArray(v.classes)&&v.classes.length?v:defaults()}catch{return defaults()}}data=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('브라우저 저장 공간이 부족하거나 저장이 제한되어 있습니다. 백업 파일을 내보내 주세요.')}}function current(){return data.classes.find(c=>c.id===data.active)||data.classes[0]}function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function randomInt(n){if(!n)return 0;const a=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n}function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){const j=randomInt(i+1);[b[i],b[j]]=[b[j],b[i]]}return b}function candidates(){const c=current();return $('repeat').checked?c.names:c.names.filter(x=>!c.picked.includes(x))}function update(){const c=current();$('classSelect').innerHTML=data.classes.map(x=>`<option value="${safe(x.id)}">${safe(x.name)}</option>`).join('');$('classSelect').value=c.id;$('totalStat').textContent=c.names.length;$('leftStat').textContent=c.names.filter(x=>!c.picked.includes(x)).length;$('pickedStat').textContent=c.picked.length;$('roster').innerHTML=c.names.length?c.names.map((n,i)=>`<div class="person ${c.picked.includes(n)?'picked':''}" data-i="${i}"><span class="name">${safe(n)}</span>${c.picked.includes(n)?'<span class="pill">뽑힘</span>':''}<button class="tiny edit" title="수정">✏️</button><button class="tiny del" title="삭제">✕</button></div>`).join(''):'<p class="sub">등록된 학생이 없습니다.</p>';$('history').innerHTML=c.history.length?c.history.slice().reverse().map(h=>`<div class="record"><span class="name">🏅 ${safe(h.winners.join(', '))}<div class="sub">${safe(h.time)} · ${safe(h.mode)}</div></span></div>`).join(''):'<p class="sub">아직 뽑기 기록이 없습니다.</p>';$('theme').value=data.theme;document.body.dataset.theme=data.theme;$('volume').value=data.volume;$('soundBtn').textContent=data.sound?'🔊 소리 켜짐':'🔇 소리 꺼짐';$('startBtn').disabled=busy||!candidates().length;$('againBtn').disabled=busy||!candidates().length;$('classSelect').disabled=busy;for(const id of ['addOne','addBulk','clearRoster','addClass','renameClass','deleteClass','importBtn','resetAll','resetPicked','clearHistory','count','repeat'])$(id).disabled=busy}function say(t){$('message').textContent=t}function clearVisual(){const v=$('visual');v.innerHTML='';v.style.display='none';$('display').style.display='';$('eyebrow').textContent='READY TO PICK?';$('display').className='display';$('arena').classList.remove('winner-ring')}function addNames(list){const c=current();let added=0;for(let n of list){n=String(n).trim();if(n&&!c.names.includes(n)){c.names.push(n);added++}}save();update();say(`${added}명 추가 완료!${list.length>added?' (중복 또는 빈 항목 제외)':''}`)}function split(s){return s.split(/[,\n\r]+/).map(x=>x.trim()).filter(Boolean)}$('addOne').onclick=()=>{addNames([$('oneName').value]);$('oneName').value=''};$('oneName').onkeydown=e=>{if(e.key==='Enter')$('addOne').click()};$('addBulk').onclick=()=>{addNames(split($('bulk').value));$('bulk').value=''};$('roster').onclick=e=>{if(busy)return;const p=e.target.closest('.person');if(!p)return;const c=current(),i=+p.dataset.i,n=c.names[i];if(e.target.closest('.del')){if(confirm(`'${n}' 학생을 삭제할까요?`)){c.names.splice(i,1);c.picked=c.picked.filter(x=>x!==n);save();update()}}else if(e.target.closest('.edit')){const a=prompt('학생 이름/번호 수정',n);if(a===null)return;const next=a.trim();if(!next||next!==n&&c.names.includes(next)){alert('빈 이름이거나 중복된 이름입니다.');return}c.names[i]=next;c.picked=c.picked.map(x=>x===n?next:x);c.history.forEach(h=>h.winners=h.winners.map(x=>x===n?next:x));save();update()}};$('classSelect').onchange=e=>{data.active=e.target.value;save();clearVisual();say('학급이 변경되었습니다.');update()};$('addClass').onclick=()=>{let n=prompt('새 학급 이름 (예: 1학년 3반)');if(!n||!n.trim())return;let id='c'+Date.now()+'-'+randomInt(1000000);data.classes.push({id,name:n.trim(),names:[],picked:[],history:[]});data.active=id;save();clearVisual();update()};$('renameClass').onclick=()=>{let n=prompt('학급 이름 변경',current().name);if(n&&n.trim()){current().name=n.trim();save();update()}};$('deleteClass').onclick=()=>{if(data.classes.length===1)return alert('마지막 학급은 삭제할 수 없습니다.');if(confirm(`'${current().name}' 학급과 모든 데이터를 삭제할까요?`)){data.classes=data.classes.filter(c=>c.id!==data.active);data.active=data.classes[0].id;save();clearVisual();update()}};$('clearRoster').onclick=()=>{if(confirm('현재 학급의 학생 명단과 뽑힌 상태를 모두 삭제할까요? (당첨 기록은 남습니다.)')){current().names=[];current().picked=[];save();clearVisual();update()}};$('clearHistory').onclick=()=>{if(confirm('현재 학급의 당첨 기록을 삭제할까요?')){current().history=[];save();update()}};$('resetPicked').onclick=()=>{if(confirm('현재 학급의 뽑힌 학생 표시를 모두 초기화할까요?')){current().picked=[];save();clearVisual();say('모든 학생이 다시 뽑기 대상이 되었습니다.');update()}};$('resetAll').onclick=()=>{if(confirm('모든 학급, 학생 명단, 당첨 기록을 삭제합니다. 계속할까요?')&&confirm('정말 전체 데이터를 초기화할까요?')){data=defaults();save();clearVisual();update()}};$('theme').onchange=e=>{data.theme=e.target.value;save();update()};$('soundBtn').onclick=()=>{data.sound=!data.sound;save();update()};$('volume').oninput=e=>{data.volume=+e.target.value;save()};$('repeat').onchange=()=>{update();say($('repeat').checked?'중복 허용: 모든 학생을 다시 뽑을 수 있습니다.':'중복 방지: 이미 뽑힌 학생은 제외됩니다.')};$('modebar').onclick=e=>{const b=e.target.closest('[data-mode]');if(!b||busy)return;mode=b.dataset.mode;document.querySelectorAll('#modebar button').forEach(x=>x.classList.toggle('active',x===b));clearVisual();say(mode==='cards'?'뽑기 시작을 누른 뒤 카드를 선택하세요!':'뽑기 시작 버튼을 눌러 주세요!')};function download(filename,contents,type){const blob=new Blob([contents],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('exportBtn').onclick=()=>download(current().name.replace(/[\\/:*?"<>|]/g,'_')+'_명단.txt',current().names.join('\n'),'text/plain;charset=utf-8');$('exportAllBtn').onclick=()=>download('랜덤뽑기_전체백업.json',JSON.stringify(data,null,2),'application/json');$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const t=await f.text();if(f.name.toLowerCase().endsWith('.json')){const v=JSON.parse(t);if(!Array.isArray(v.classes)||!v.classes.length||!v.classes.every(c=>typeof c.id==='string'&&typeof c.name==='string'&&Array.isArray(c.names)&&Array.isArray(c.picked)&&Array.isArray(c.history)))throw Error('백업 파일의 형식이 올바르지 않습니다.');if(!confirm('현재 전체 데이터를 백업 파일로 교체할까요?'))return;data={...defaults(),...v};if(!data.classes.some(c=>c.id===data.active))data.active=data.classes[0].id;data.classes.forEach(c=>{c.names=[...new Set(c.names.filter(x=>typeof x==='string'&&x.trim()))];c.picked=c.picked.filter(x=>c.names.includes(x));c.history=c.history.filter(x=>Array.isArray(x.winners)&&typeof x.mode==='string'&&typeof x.time==='string')});save();clearVisual();update()}else{const names=split(t.replace(/^\uFEFF/,''));addNames(names)}}catch(err){alert('파일을 불러올 수 없습니다: '+err.message)}finally{e.target.value=''}};function audio(){if(!data.sound||!data.volume)return null;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}catch{return null}}function tone(freq,dur=.08,type='sine',gain=.1,when=0){const c=audio();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+when;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(Math.max(.0001,gain*data.volume/100),t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.01)}function fanfare(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.23,i*.14))}function tick(){tone(300+randomInt(250),.035,'square',.03)}function fireworks(){const canvas=$('confetti'),c=canvas.getContext('2d');canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;c.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);particles=Array.from({length:170},()=>{const angle=Math.random()*Math.PI*2,speed=Math.random()*7+2;return{x:innerWidth*(.25+Math.random()*.5),y:innerHeight*(.24+Math.random()*.3),vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:65+Math.random()*55,hue:randomInt(360),r:2+Math.random()*4}});cancelAnimationFrame(frame);function draw(){c.clearRect(0,0,innerWidth,innerHeight);particles=particles.filter(p=>p.life>0);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.vx*=.995;p.life--;c.fillStyle=`hsla(${p.hue},100%,70%,${Math.min(1,p.life/30)})`;c.beginPath();c.arc(p.x,p.y,p.r,0,Math.PI*2);c.fill()}if(particles.length)frame=requestAnimationFrame(draw)}draw()}function reveal(winners){busy=false;clearVisual();$('eyebrow').textContent='🎉 CONGRATULATIONS! 🎉';$('display').textContent=winners.join(' · ');$('display').classList.add('winner');if(winners.length>2)$('display').classList.add('small');$('arena').classList.add('winner-ring');say(winners.length===1?'오늘의 행운 주인공! 🌟':`행운의 주인공 ${winners.length}명! 🌟`);const c=current();winners.forEach(n=>{if(!c.picked.includes(n))c.picked.push(n)});c.history.push({time:new Date().toLocaleString('ko-KR'),mode:{name:'이름',wheel:'룰렛',cards:'카드',slot:'슬롯머신'}[mode],winners});save();update();fanfare();fireworks();if(!$('repeat').checked&&!candidates().length)say('🎊 모든 학생이 한 번씩 뽑혔습니다! 뽑힌 학생 초기화로 다시 시작할 수 있어요.')}function setDisplay(name,slot){if(slot){$('display').textContent=name}else $('display').textContent=name}function animateNames(pool,winners,duration,slot=false){const start=perfor ></div>';cardCandidates=shuffle(pool);const cardCount=Math.min(Math.max(3,cardCandidates.length),12);const container=$('cards');for(let i=0;i<cardCount;i++){const b=document.createElement('button');b.className='pickcard';b.textContent='?';b.setAttribute('aria-label',`${i+1}번 카드`);b.onclick=()=>{if(!busy||container.dataset.selected)return;container.dataset.selected='1';b.classList.add('revealed');b.textContent='✨';$('eyebrow').textContent='카드가 열립니다!';say('두근두근...');tone(450,.13,'triangle',.15);setTimeout(()=>{b.textContent=winners.length===1?winners[0]:'🎉';setTimeout(()=>reveal(winners),750)},Math.min(1500,duration-300))};container.append(b)}say(`카드 한 장을 선택하세요! (${duration/1000}초 설정: 공개 연출 시간)`)}async function begin(){if(busy)return;const pool=candidates(),amount=Number($('count').value);if(!pool.length){alert('뽑을 학생이 없습니다. 명단을 추가하거나 뽑힌 학생을 초기화해 주세요.');return}if(!Number.isInteger(amount)||amount<1){alert('뽑을 인원을 1명 이상 입력하세요.');return}if(amount>pool.length&&!$('repeat').checked){alert(`현재 뽑을 수 있는 학생은 ${pool.length}명입니다.`);return}if(amount>100){alert('한 번에 최대 100명까지 뽑을 수 있습니다.');return}const winners=$('repeat').checked?Array.from({length:amount},()=>pool[randomInt(pool.length)]):shuffle(pool).slice(0,amount),duration=+$('duration').value;busy=true;update();clearVisual();$('eyebrow').textContent='🎲 추첨 중 🎲';say('운명의 시간이 시작됩니다!');tone(392,.2,'sawtooth',.09);if(mode==='cards')setupCards(pool,winners,duration);else if(mode==='wheel')animateWheel(pool,winners,duration);else if(mode==='slot'){$('visual').style.display='block';$('visual').innerHTML='<div class="slot"></div>';const slot=$('visual').firstElementChild;slot.append($('display'));$('display').style.display='';animateNames(pool,winners,duration,true)}else animateNames(pool,winners,duration)}$('startBtn').onclick=begin;$('againBtn').onclick=begin;function moveDisplayBack(){if($('display').parentElement!==$('arena'))$('arena').insertBefore($('display'),$('message'))}const originalClear=clearVisual;clearVisual=function(
